# MC sample catalog for the displaced di-muon vertex tagger.
#
# This file lists the physics processes we want and the DAS name patterns they
# should match. It does NOT store resolved dataset names: run
# scripts/resolve_samples.py on lxplus/LPC to expand the patterns against DAS.
#
# Patterns are DAS wildcards (only `*`, case-sensitive) for the PRIMARY dataset
# name. The processed-dataset part comes from `runs.<run>.campaign_globs`, and
# each returned dataset is assigned to an era by the regexes under `eras`.
#
# status:
#   standard        - standard CMS central sample naming; expected to resolve as-is
#   run3-confirmed  - Run 3 patterns taken from real names found by `--discover`
#                     (2026-11-16)
#   confirmed       - Run 2 and Run 3 patterns taken from real names (2026-11-19)
#   unverified      - best-guess pattern; confirm with `resolve_samples.py --discover`
#                     and replace with the real primary dataset names
#   not used        - kept for reference, no patterns
#
# Run 3 signal names changed in 2024: parameters moved behind `_Par-`
# (e.g. HTo2ZdTo2mu2x_MZd-20_ctau-10mm_... in 2022/23 vs
# HTo2ZdTo2Mu2X_Par-MZd-20-Ctau-10mm_... in 2024), so most signals need two
# patterns. All Run 3 signal patterns require 13p6TeV, which keeps out 14 TeV
# samples that sit in the same campaigns but match no era.
#
# Background names changed in 2024 too: bins moved behind `_Bin-` and filters
# behind `_Fil-` (QCD_PT-15to20_MuEnrichedPt5_... vs
# QCD_Bin-PT-15to20_Fil-MuEnriched_...), and inclusive DY and W+jets are split
# by lepton flavour (DYto2Mu-2Jets_..., WtoMuNu-2Jets_...). The 2024 background
# patterns below come from DAS listings of RunIII2024Summer24MiniAOD (2026-11-18).
#
# Background datasets are produced with an event filter (only events with a
# DiMuonVtx candidate; see nanoaod/README.md). A process can set
# `event_filter: true/false` to override the role-based default.
#
# Patterns name the nominal samples only. Systematic variations (top mass,
# hdamp, tune, DGamma, ...) are left out: they would multiply the production.

default_tiers: [MINIAODSIM, NANOAODSIM]   # AODSIM can be requested with --tier

# Processed names are <campaign>-[<prefix>_]<global tag>[_extN]-vN. Standard
# samples have no prefix; special productions add one. Per process, primary
# and era the resolver uses a `prefer` prefix if one exists, else the standard
# sample, else any other prefix (KeepRAW, MUO_POG, ...). `exclude` prefixes are
# never used. Globs (`*` only), matched against the whole prefix.
processing_prefixes:
  prefer:
    - FixLLSleptonSim   # re-simulation fixing long-lived sleptons; supersedes the standard sample
  exclude:
    - FS*               # FastSim (FS, FSUL18, ...): no realistic displaced-muon reconstruction
    - Poisson*          # flat Poisson pileup (e.g. Poisson60KeepRAW), not the realistic profile
    - "*PU*"            # special pileup: NoPU, EpsilonPU, PU35ForTRK, PUForMUOVal, PUMu4, ...
    - "*Pilot*"         # pilot productions

runs:
  run2:
    sqrt_s: "13 TeV"
    campaign_globs: ["RunIISummer20UL*"]
    eras:
      2016preVFP:
        MINIAODSIM: '^RunIISummer20UL16MiniAODAPV(v\d+)?-'
        NANOAODSIM: '^RunIISummer20UL16NanoAODAPV(v\d+)?-'
        AODSIM:     '^RunIISummer20UL16RECOAPV-'
      2016postVFP:
        MINIAODSIM: '^RunIISummer20UL16MiniAOD(v\d+)?-'
        NANOAODSIM: '^RunIISummer20UL16NanoAOD(v\d+)?-'
        AODSIM:     '^RunIISummer20UL16RECO-'
      2017:
        MINIAODSIM: '^RunIISummer20UL17MiniAOD(v\d+)?-'
        NANOAODSIM: '^RunIISummer20UL17NanoAOD(v\d+)?-'
        AODSIM:     '^RunIISummer20UL17RECO-'
      2018:
        MINIAODSIM: '^RunIISummer20UL18MiniAOD(v\d+)?-'
        NANOAODSIM: '^RunIISummer20UL18NanoAOD(v\d+)?-'
        AODSIM:     '^RunIISummer20UL18RECO-'
  run3:
    sqrt_s: "13.6 TeV"
    campaign_globs: ["Run3Summer2*", "RunIII2024Summer24*"]
    eras:
      2022preEE:
        MINIAODSIM: '^Run3Summer22MiniAOD(v\d+)?-'
        NANOAODSIM: '^Run3Summer22NanoAOD(v\d+)?-'
        AODSIM:     '^Run3Summer22(DRPremix|DR|RECO)-'
      2022postEE:
        MINIAODSIM: '^Run3Summer22EEMiniAOD(v\d+)?-'
        NANOAODSIM: '^Run3Summer22EENanoAOD(v\d+)?-'
        AODSIM:     '^Run3Summer22EE(DRPremix|DR|RECO)-'
      2023preBPix:
        MINIAODSIM: '^Run3Summer23MiniAOD(v\d+)?-'
        NANOAODSIM: '^Run3Summer23NanoAOD(v\d+)?-'
        AODSIM:     '^Run3Summer23(DRPremix|DR|RECO)-'
      2023postBPix:
        MINIAODSIM: '^Run3Summer23BPixMiniAOD(v\d+)?-'
        NANOAODSIM: '^Run3Summer23BPixNanoAOD(v\d+)?-'
        AODSIM:     '^Run3Summer23BPix(DRPremix|DR|RECO)-'
      2024:
        MINIAODSIM: '^RunIII2024Summer24MiniAOD(v\d+)?-'
        NANOAODSIM: '^RunIII2024Summer24NanoAOD(v\d+)?-'
        AODSIM:     '^RunIII2024Summer24(DRPremix|DR|RECO)-'

processes:

  # ---------------------------------------------------------------- signal --
  # Signal = a mu+mu- pair from a common displaced vertex of a long-lived
  # particle. Per-candidate labels come from truth matching both muons to the
  # same LLP; unmatched pairs in signal MC are background-like.
  #
  # Run 2 signal comes from UL campaigns only: the custom NanoAOD runs on UL
  # MiniAODv2. The only UL LLP -> mu mu signal (checked 2026-11-19) is 4
  # H -> XX -> 2mu2jets points in 2016; 2016preVFP has them only as
  # MiniAODv1, which has no NANO recipe, so 2016postVFP is left. UL has no
  # HAHM -> mu mu (*HAHM* matches only HAHMHToAA_AToGG, a -> gamma gamma), no
  # RPV squark, and its B -> K phi samples have phi -> pi pi. The Run 2
  # benchmarks are in pre-UL campaigns (RunIIAutumn18, RunIISummer16), which
  # are not used.

  hahm_zd:
    role: signal
    priority: core
    status: run3-confirmed
    description: >-
      Hidden Abelian Higgs model, gg -> H(125) -> Z_D Z_D, Z_D -> mu mu.
      Benchmark of CMS EXO-21-006 (Run 2) and EXO-23-014 (Run 3, 2022).
      Run 3: m(Z_D) from 0.5 GeV, ctau in the name. 2022/23 uses two names
      (HTo2ZdTo2mu2x_MZd-..._ctau-... and HTo2ZdTo2Mu2X_MZd-...-Ctau-...),
      2024 uses HTo2ZdTo2Mu2X_Par-.... (*HAHM* is not used: in Run 3 it only
      matches HAHM a -> bb / a -> gamma gamma samples, no muons.)
    patterns:
      run3: ["HTo2ZdTo2mu2x_*_TuneCP5_13p6TeV*", "HTo2ZdTo2Mu2X_*_TuneCP5_13p6TeV*"]

  h_to_llp_scalars:
    role: signal
    priority: core
    status: run3-confirmed
    description: >-
      Simplified model, heavy scalar H -> X X with long-lived X -> mu mu
      (EXO-21-006). Covers m(X) above ~10 GeV and heavier parents than Z_D.
      Run 3 has 4mu (both X -> mu mu) and 2mu2jets (one X -> mu mu, one ->
      jets) variants; a few 4mu points exist twice, with ..._13p6TeV_pythia8
      and ..._13p6TeV-pythia8 names.
    patterns:
      run2: ["HTo2LongLivedTo2mu2jets_*_TuneCP5_13TeV-pythia8"]   # 4 points, UL16 only
      run3: ["HTo2LongLivedTo4mu_*_13p6TeV*", "HTo2LongLivedTo2mu2jets_*_13p6TeV*",
             "HTo2LongLivedTo4Mu_Par-*_13p6TeV*", "HTo2LongLivedTo2Mu2Jets_Par-*_13p6TeV*"]

  rpv_neutralino_mumunu:
    role: signal
    priority: secondary
    status: run3-confirmed
    description: >-
      RPV SUSY, squark -> q neutralino, neutralino -> l l nu (EXO-23-014;
      mu mu nu and e e nu, 50% each). Adds missing momentum and a boosted,
      asymmetric vertex topology.
    patterns:
      run3: ["SquarkToNeutralinoTo2LNu*_TuneCP5_13p6TeV*"]  # "2LNu-MSquark_" (2022/23), "2LNu_Par-" (2024)

  ttbar_alp_mumu:
    role: signal
    priority: secondary
    status: run3-confirmed
    description: >-
      ttbar events with a long-lived axion-like particle a -> mu mu, m(a)
      0.35-60 GeV, ctau in the name. Covers the low-mass region in Run 3,
      where no B -> K phi sample exists. Two variants per point: plain, and
      with a generator filter on the muons' production vertex
      (MuVtxR7Z10-MuFromALP in the name).
    patterns:
      run3: ["TTALPto2Mu*_TuneCP5_13p6TeV*"]

  b_to_k_phi_mumu:
    role: signal
    priority: secondary
    status: not used
    description: >-
      B -> K phi, light long-lived scalar phi -> mu mu (scouting searches
      EXO-20-014 / EXO-24-016). Not used: no Run 3 MiniAOD sample
      (--discover, 2026-11-16), and the Run 2 UL samples
      (BToKPhi_MuonGenFilter_[MDS_]PhiToPiPlusPiMinus_..., 2018) have
      phi -> pi+ pi-, not mu mu. See ttbar_alp_mumu for low-mass signal.
    patterns: {}

  # ------------------------------------------------------------ background --

  qcd_muenriched:
    role: background
    priority: core
    status: standard
    description: >-
      Muon-enriched QCD multijet. Dominant source of non-prompt muons:
      semileptonic b/c decays (incl. b -> c -> mu sequential pairs with real
      displaced vertices), pi/K decay in flight, random two-track crossings.
    patterns:
      # Pt-binned MuEnrichedPt5 only, as in Run 3; not the overlapping
      # QCD_Pt-20_MuEnrichedPt15 or the small QCD_Pt-20toInf_MuEnrichedPt5.
      run2: ["QCD_Pt-*To*_MuEnrichedPt5_TuneCP5_13TeV-pythia8", "QCD_Pt-1000_MuEnrichedPt5_TuneCP5_13TeV-pythia8"]
      run3:
        - "QCD_P*_MuEnrichedPt5_TuneCP5_13p6TeV*"                   # 2022/23
        - "QCD_Bin-PT-*_Fil-MuEnriched_TuneCP5_13p6TeV*"            # 2024

  nonprompt_jpsi:
    role: background
    priority: core
    status: unverified
    description: >-
      b-hadron -> J/psi(mu mu) X. Genuinely displaced (~mm) dimuon vertices
      at m = 3.1 GeV; the irreducible background at small displacement.
      Run 3 uses one channel, B+ -> J/psi K+: the B+, B0 and Bs lifetimes
      agree within 10%, so the vertex displacement looks the same, and the
      broad "B*ToJpsi*" pattern matched 32 samples (2.9 billion events in
      2024 alone).
    patterns:
      # B+ -> J/psi K+ with a b-muon filter, as in Run 3 (2018 UL had 18
      # B -> J/psi X samples, 2-98 M events each, matching B*ToJpsi*).
      run2: ["BuToJpsiK_BMuonFilter_SoftQCDnonD_TuneCP5_13TeV*"]
      # 2024: ButoJpsiK-Jpsito2Mu_[Fil-Mu_]TuneCP5_...; 2022/23 is expected to
      # use underscores (as BdtoJpsiKstar_Jpsito2Mu_KstartoKPi_... does).
      run3: ["ButoJpsiK*Jpsito2Mu*_TuneCP5_13p6TeV*"]

  drell_yan:
    role: background
    priority: core
    status: standard
    description: >-
      Prompt opposite-sign dimuons (incl. low mass and Z -> tau tau -> mu mu).
      Tests that the tagger does not fire on prompt vertices or resolution tails.
    patterns:
      run2:
        - "DYJetsToLL_M-50_TuneCP5_13TeV-amcatnloFXFX-pythia8"
        - "DYJetsToLL_M-10to50_TuneCP5_13TeV-madgraphMLM-pythia8"
      run3:
        - "DYto2L-2Jets_MLL-50_TuneCP5_13p6TeV_amcatnloFXFX-pythia8"
        - "DYto2L-2Jets_MLL-10to50_TuneCP5_13p6TeV_amcatnloFXFX-pythia8"
        - "DYto2Mu_MLL-*_TuneCP5_13p6TeV_powheg-pythia8"
        # 2024: inclusive samples are split by lepton flavour (no ee).
        - "DYto2Mu-2Jets_Bin-MLL-50_TuneCP5_13p6TeV_amcatnloFXFX-pythia8"
        - "DYto2Mu-2Jets_Bin-MLL-10to50_TuneCP5_13p6TeV_amcatnloFXFX-pythia8"
        - "DYto2Tau-2Jets_Bin-MLL-50_TuneCP5_13p6TeV_amcatnloFXFX-pythia8"
        - "DYto2Tau-2Jets_Bin-MLL-10to50_TuneCP5_13p6TeV_amcatnloFXFX-pythia8"
        - "DYto2Mu_Bin-MLL-*_TuneCP5_13p6TeV_powheg-pythia8"

  ttbar:
    role: background
    priority: core
    status: standard
    description: >-
      Top pairs. b-hadron decays plus prompt W muons give mixed
      prompt/displaced pairs and heavy-flavour vertices at higher pT than QCD.
    patterns:
      run2:
        - "TTTo2L2Nu_TuneCP5_13TeV-powheg-pythia8"
        - "TTToSemiLeptonic_TuneCP5_13TeV-powheg-pythia8"
      run3:
        - "TTto2L2Nu_TuneCP5_13p6TeV_powheg-pythia8"
        - "TTtoLNu2Q_TuneCP5_13p6TeV_powheg-pythia8"

  prompt_quarkonia:
    role: background
    priority: secondary
    status: unverified
    description: >-
      Prompt J/psi and Upsilon -> mu mu. Narrow resonances at the primary
      vertex; useful to keep the tagger from learning the mass.
    patterns:
      # J/psi and Upsilon(1S,2S,3S) -> mu mu, TuneCP5 only (each Upsilon also
      # exists with TuneCP1); not the pT-binned, tau tau or cascade samples.
      run2: ["JpsiToMuMu_JpsiPt8_TuneCP5_13TeV*", "Upsilon*SToMuMu_Pt5_TuneCP5_13TeV*"]
      run3: ["Jpsito2Mu*_13p6TeV*", "Upsilon*_13p6TeV*"]

  single_top_tw:
    role: background
    priority: secondary
    status: standard
    description: >-
      tW production; same mechanisms as ttbar at lower rate. Dilepton and
      semileptonic decays, as for ttbar.
    patterns:
      run2:
        # nominal NoFullyHadronicDecays only (the wildcard also matched
        # mtop, hdamp, width, DS and inclusiveDecays samples)
        - "ST_tW_top_5f_NoFullyHadronicDecays_TuneCP5_13TeV-powheg-pythia8"
        - "ST_tW_antitop_5f_NoFullyHadronicDecays_TuneCP5_13TeV-powheg-pythia8"
      run3:
        - "TWminusto2L2Nu_TuneCP5_13p6TeV_powheg-pythia8"
        - "TbarWplusto2L2Nu_TuneCP5_13p6TeV_powheg-pythia8"
        - "TWminustoLNu2Q_TuneCP5_13p6TeV_powheg-pythia8"
        - "TbarWplustoLNu2Q_TuneCP5_13p6TeV_powheg-pythia8"

  wjets:
    role: background
    priority: secondary
    status: standard
    description: W(mu nu) + a non-prompt muon from a jet; fake-vertex topology.
    patterns:
      run2: ["WJetsToLNu_TuneCP5_13TeV-madgraphMLM-pythia8"]
      run3:
        - "WtoLNu-2Jets_TuneCP5_13p6TeV_amcatnloFXFX-pythia8"
        - "WtoLNu-4Jets_TuneCP5_13p6TeV_madgraphMLM-pythia8"
        # 2024: split by lepton flavour (no e nu).
        - "WtoMuNu-2Jets_TuneCP5_13p6TeV_amcatnloFXFX-pythia8"
        - "WtoTauNu-2Jets_TuneCP5_13p6TeV_amcatnloFXFX-pythia8"
        - "WtoMuNu-4Jets_TuneCP5_13p6TeV_madgraphMLM-pythia8"
        - "WtoTauNu-4Jets_TuneCP5_13p6TeV_madgraphMLM-pythia8"

  diboson:
    role: background
    priority: secondary
    status: standard
    description: Inclusive WW, WZ, ZZ; small, prompt multi-muon backgrounds.
    patterns:
      run2:
        - "WW_TuneCP5_13TeV-pythia8"
        - "WZ_TuneCP5_13TeV-pythia8"
        - "ZZ_TuneCP5_13TeV-pythia8"
      run3:
        - "WW_TuneCP5_13p6TeV_pythia8"
        - "WZ_TuneCP5_13p6TeV_pythia8"
        - "ZZ_TuneCP5_13p6TeV_pythia8"

  # --------------------------------------------------------------- control --

  displaced_susy_uncorrelated:
    role: control
    priority: optional
    status: confirmed
    description: >-
      Two displaced muons that do NOT share a vertex. Hard negatives: tests
      vertex compatibility, not just large impact parameter. Run 2: RPV
      stop -> l b and stop -> l d, pair-produced (DisplacedSUSY, 60 + 60
      points per UL era). Run 3: GMSB smuon -> mu gravitino, pair-produced,
      so each muon comes from a different smuon (no DisplacedSUSY samples
      exist in Run 3).
    patterns:
      run2: ["DisplacedSUSY_stopToLBottom_*", "DisplacedSUSY_stopToLD_*"]
      run3: ["SMuonToMuGravitino_*_TuneCP5_13p6TeV*"]

# Not covered by MC here: cosmic-ray muons. Use cosmic / NoBPTX data, as the
# published analyses do.

# Broad patterns for `resolve_samples.py --discover`, which lists matching
# primary datasets so the `unverified` signal patterns can be replaced.
discovery_patterns:
  - "*Zd*"
  - "*HAHM*"
  - "*DarkPhoton*"
  - "*LongLived*"
  - "*LLP*"
  - "*Displaced*"
  - "*ctau*"
  - "*cTau*"
  - "*CTau*"
  - "*Ctau*"
  - "*ToKPhi*"
  - "*toKPhi*"
  - "*Neutralino*Mu*"
  - "*HiddenValley*"
  - "*ALPto*"
  - "*SMuon*"
